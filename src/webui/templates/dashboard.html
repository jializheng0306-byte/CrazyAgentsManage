<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>监控仪表板 - CrazyAgentsManage</title>
  <link rel="stylesheet" href="{{ BASE }}/static/css/design-system.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/nav.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/dashboard.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/components.css">
</head>
<body>
  {% set active_nav = 'runtime' %}
  {% include 'ia-nav.html' %}

  <!-- Main Content - Vercel Trace Style (Nested Tree, NOT Gantt Chart) -->
  <main id="dashboard-app">

    <!-- Breadcrumb / Project Bar -->
    <div class="vw-top-bar">
      <div class="vw-breadcrumb">
        <span class="vw-breadcrumb-icon">◀</span>
        <span class="vw-breadcrumb-text">Hermes Agent</span>
        <span class="vw-breadcrumb-sep">/</span>
        <span class="vw-breadcrumb-text">Workflows</span>
        <span class="vw-breadcrumb-sep">/</span>
        <span class="vw-breadcrumb-current" id="sessionRunId">session_latest</span>
        <a class="vw-external-link" href="{{ BASE }}/sessions" title="查看所有会话">↗</a>
      </div>
    </div>

    <!-- Task Header Row -->
    <div class="vw-task-header">
      <div class="vw-task-title-row">
        <h1 class="vw-task-name" id="taskName">Hermes 会话追踪</h1>
        <span class="vw-status-pill vw-status-running" id="statusPill">
          <span class="vw-status-dot"></span>
          <span id="statusText">运行中</span>
        </span>
      </div>
      <div class="vw-task-actions">
        <button class="vw-btn-outline" onclick="window.location.href='{{ BASE }}/sessions'">查看全部会话</button>
        <button class="vw-btn-more" onclick="toggleMenu()">⋮</button>
      </div>
    </div>

    <!-- Metadata Strip -->
    <div class="vw-meta-strip">
      <div class="vw-meta-item">
        <span class="vw-meta-label">创建时间</span>
        <span class="vw-meta-value" id="metaCreated">--</span>
      </div>
      <div class="vw-meta-item">
        <span class="vw-meta-label">完成时间</span>
        <span class="vw-meta-value" id="metaCompleted">--</span>
      </div>
      <div class="vw-meta-item">
        <span class="vw-meta-label">持续时间</span>
        <span class="vw-meta-value" id="metaDuration">--</span>
      </div>
      <div class="vw-meta-item">
        <span class="vw-meta-label">Token 消耗</span>
        <span class="vw-meta-value" id="metaTokens">--</span>
      </div>
      <div class="vw-meta-item">
        <span class="vw-meta-label">消息数</span>
        <span class="vw-meta-value" id="metaMessages">--</span>
      </div>
      <div class="vw-meta-item">
        <span class="vw-meta-label">来源</span>
        <span class="vw-meta-value" id="metaSource">--</span>
      </div>
    </div>

    <!-- Tab Bar -->
    <div class="vw-tab-bar">
      <button class="vw-tab vw-tab-active" data-tab="trace" onclick="switchTab('trace')">Trace</button>
      <button class="vw-tab" data-tab="events" onclick="switchTab('events')">Events</button>
      <button class="vw-tab" data-tab="streams" onclick="switchTab('streams')">Streams</button>
    </div>

    <!-- Search Bar -->
    <div class="vw-search-bar">
      <svg class="vw-search-icon" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <input type="text" class="vw-search-input" placeholder="Search spans..." id="traceSearch" oninput="filterTrace()">
    </div>

    <!-- Trace Summary Bar -->
    <div class="vw-summary-bar" id="traceSummary" style="display:none;"></div>

    <!-- Trace Tree Area (Nested tree structure - Vercel Trace style) -->
    <div class="vw-trace-container" id="traceContainer">
      <div class="vw-trace-header-row">
        <span class="vw-trace-col-span">SPAN</span>
        <span class="vw-trace-col-token">Token</span>
        <span class="vw-trace-col-duration">Duration</span>
        <span class="vw-trace-col-status">Status</span>
      </div>
      <div class="vw-trace-tree" id="traceTree"></div>
    </div>

    <!-- Footer -->
    <div class="vw-footer">
      Hermes Agent 内置可观测性仪表板 — 基于 SessionDB 实时数据构建
    </div>

  </main>

  <!-- Side Detail Panel (Right Slide-out) -->
  <div class="vw-side-panel-overlay" id="sidePanelOverlay" onclick="closeSidePanel()"></div>
  <div class="vw-side-panel" id="sidePanel">
    <div class="vw-side-panel-header">
      <div class="vw-side-panel-title-row">
        <span class="vw-side-panel-icon" id="spIcon">📌</span>
        <span class="vw-side-panel-title" id="spTitle">详情</span>
        <span class="vw-side-panel-badge" id="spBadge">--</span>
      </div>
      <button class="vw-side-panel-close" onclick="closeSidePanel()">✕</button>
    </div>
    <div class="vw-side-panel-body" id="spBody"></div>
  </div>

  <script src="{{ BASE }}/static/js/common.js"></script>
  <script src="{{ BASE }}/static/js/dashboard.js"></script>
</body>
</html>
