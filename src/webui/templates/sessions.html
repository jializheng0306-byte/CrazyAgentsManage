<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话流水线索引 - CrazyAgentsManage</title>
  <link rel="stylesheet" href="{{ BASE }}/static/css/design-system.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/nav.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/sessions.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/components.css">
</head>
<body>

{% set active_nav = 'runtime' %}
{% include 'ia-nav.html' %}

  <main class="container mt-lg">

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-number" id="statTotal">--</div>
        <div class="stat-label">会话总数</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="statChild">--</div>
        <div class="stat-label">子会话</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="statMessages">--</div>
        <div class="stat-label">消息总数</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="statActive">--</div>
        <div class="stat-label">活跃会话</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="statTokens">--</div>
        <div class="stat-label">Token 消耗</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="statSources">--</div>
        <div class="stat-label">来源分布</div>
      </div>
    </div>

    <div class="session-toolbar">
      <div class="toolbar-left">
        <select class="header-select" id="sourceFilter" onchange="filterBySource(this.value)">
          <option value="">全部来源</option>
        </select>
        <select class="header-select" id="statusFilter" onchange="filterByStatus(this.value)">
          <option value="">全部状态</option>
          <option value="active">执行中</option>
          <option value="completed">已完成</option>
          <option value="error">异常</option>
        </select>
      </div>
      <div class="toolbar-right">
        <input type="text" class="header-search session-search" placeholder="搜索会话内容..." id="sessionSearch">
        <button class="btn-favorite" onclick="exportSessions()" title="导出会话列表">📥 导出</button>
      </div>
    </div>

    <div class="session-layout">
      <aside class="session-list-panel">
        <div class="session-list-header">
          根会话索引
          <span class="session-count" id="sessionCount">加载中...</span>
        </div>
        <div class="session-list" id="sessionList">
          <div style="padding: 24px; text-align: center; color: #64748b;">加载中...</div>
        </div>
        <div class="session-list-footer" id="sessionPagination"></div>
      </aside>

      <section class="detail-panel" id="detailPanel">
        <div class="empty-state">
          <div class="empty-state-icon">📋</div>
          <div>选择左侧会话查看详情</div>
        </div>
      </section>
    </div>

  </main>

  <script src="{{ BASE }}/static/js/common.js"></script>
  <script src="{{ BASE }}/static/js/sessions.js"></script>
</body>
</html>
