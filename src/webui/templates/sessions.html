<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话流水线索引 - CrazyAgentsManage</title>
  <link rel="stylesheet" href="{{ BASE }}/static/css/design-system.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/nav.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/sessions.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/components.css">
</head>
<body>
  {% set active_nav = 'runtime' %}
  {% include 'ia-nav.html' %}

  <main class="container mt-lg">

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-number">--</div>
        <div class="stat-label">会话总数</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">--</div>
        <div class="stat-label">子会话</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">--</div>
        <div class="stat-label">消息总数</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">--</div>
        <div class="stat-label">活跃会话</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">--</div>
        <div class="stat-label">来源分布</div>
      </div>
    </div>

    <div class="session-layout">
      <aside class="session-list-panel">
        <div class="session-list-header">
          根会话索引
          <span class="session-count">加载中...</span>
        </div>
        <div class="session-list">
          <div style="padding: 24px; text-align: center; color: #64748b;">加载中...</div>
        </div>
      </aside>

      <section class="detail-panel">
        <div style="padding: 24px; text-align: center; color: #64748b;">选择左侧会话查看详情</div>
      </section>
    </div>

  </main>

  <script src="{{ BASE }}/static/js/common.js"></script>
  <script src="{{ BASE }}/static/js/sessions.js"></script>
</body>
</html>
